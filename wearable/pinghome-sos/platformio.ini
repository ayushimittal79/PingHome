; PingHome ESP32 SOS wearable
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor -b 115200
; See ../../docs/wearable.md for wiring, flashing, and battery/enclosure notes.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=1
