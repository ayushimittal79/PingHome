spring:
  application:
    name: pinghome-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pinghome?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:pinghome}
    password: ${DB_PASSWORD:pinghome}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration), not Hibernate - this only
      # ever checks the migrated schema matches the entities, never changes it. Same behavior
      # locally and on Azure MySQL, so there's no "works locally, fails in prod" schema drift.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    # Safe for both a database that already has Hibernate-created tables (e.g. any existing
    # local dev database from before this project used Flyway) and a genuinely empty one (e.g.
    # a brand-new Azure MySQL server): if tables already exist but flyway_schema_history doesn't,
    # Flyway records the schema as already being at baseline-version and does NOT re-run V1
    # against it. On a truly empty schema, baseline is a no-op and V1__init.sql runs normally -
    # no manual bootstrap step needed before the first deployment.
    baseline-on-migrate: true
    baseline-version: "1"

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# --- PingHome-specific configuration -----------------------------------------------------
pinghome:
  demo-mode: ${DEMO_MODE:false}

  jwt:
    # MUST be overridden (PINGHOME_JWT_SECRET) outside local development. This default exists
    # only so `mvn spring-boot:run` works out of the box for coursework/demo purposes.
    secret: ${PINGHOME_JWT_SECRET:pinghome-local-development-secret-change-me-please-32bytes+}
    expiration-minutes: ${PINGHOME_JWT_EXPIRATION_MINUTES:10080} # 7 days
    issuer: pinghome-backend

  scheduler:
    # How often the escalation scheduler polls ACTIVE trips. Demo mode shortens this via
    # DEMO_MODE=true (see application-demo.yml) - the underlying nudge/escalation logic is
    # identical either way.
    interval-ms: ${PINGHOME_SCHEDULER_INTERVAL_MS:30000}

  escalation:
    nudge-timeout-minutes: ${PINGHOME_NUDGE_TIMEOUT_MINUTES:5}

  sos:
    dedup-seconds: ${PINGHOME_SOS_DEDUP_SECONDS:15}

  firebase:
    credentials-json: ${PINGHOME_FIREBASE_CREDENTIALS_JSON:}
    credentials-path: ${PINGHOME_FIREBASE_CREDENTIALS_PATH:}

  sms:
    enabled: ${PINGHOME_SMS_ENABLED:false}
    account-sid: ${PINGHOME_TWILIO_ACCOUNT_SID:}
    auth-token: ${PINGHOME_TWILIO_AUTH_TOKEN:}
    from-number: ${PINGHOME_TWILIO_FROM_NUMBER:}

logging:
  level:
    com.pinghome.backend: INFO
