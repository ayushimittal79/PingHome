# Activated with SPRING_PROFILES_ACTIVE=cloud on any deployed instance (currently an Azure VM
# talking to Azure Database for MySQL - see docs/deployment.md). All secrets/connection details
# still come from environment variables; this profile only tightens defaults that are fine
# loose for local dev but shouldn't be for a deployed instance.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000

pinghome:
  jwt:
    # Fail fast instead of silently signing tokens with the public development secret.
    reject-default-secret: true

logging:
  level:
    com.pinghome.backend: INFO
    org.hibernate: WARN
