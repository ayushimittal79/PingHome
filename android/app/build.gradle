plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.pinghome.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.pinghome.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Supply a real keystore via Gradle properties (-P flags or ~/.gradle/gradle.properties,
        // never committed) for a distributable release build; see docs/setup.md. Without one,
        // release falls back to the debug key so `assembleRelease` still yields an installable
        // APK for demos.
        release {
            def keystorePath = project.findProperty('PINGHOME_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword project.findProperty('PINGHOME_KEYSTORE_PASSWORD')
                keyAlias project.findProperty('PINGHOME_KEY_ALIAS')
                keyPassword project.findProperty('PINGHOME_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "BASE_URL", "\"${project.findProperty('PINGHOME_API_BASE_URL_DEBUG') ?: 'http://10.0.2.2:8080/'}\""
            buildConfigField "boolean", "DEMO_MODE", "${project.findProperty('DEMO_MODE') ?: true}"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig project.findProperty('PINGHOME_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
            // Must be the deployed backend's HTTPS origin (network_security_config.xml blocks
            // cleartext everywhere except the emulator loopback). Pass -PPINGHOME_API_BASE_URL=...
            buildConfigField "String", "BASE_URL", "\"${project.findProperty('PINGHOME_API_BASE_URL') ?: 'https://REPLACE-WITH-BACKEND-URL/'}\""
            buildConfigField "boolean", "DEMO_MODE", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime:2.9.1'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Location / Geofencing (Google Play Services - on-device, no API key or billing needed)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // Map display: OpenStreetMap tiles via osmdroid - no API key, no billing account required.
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // Firebase (Cloud Messaging)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
